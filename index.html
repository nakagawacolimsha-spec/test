<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaka Nakagawa | Art Director & Illustrator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #fafafa;
            color: #2c2c2c;
        }
        /* ふわっと浮かび上がるアニメーションの準備 */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- ヘッダー（サイトタイトル） -->
    <header class="text-center pt-32 pb-24 fade-up">
        <h1 class="text-3xl md:text-4xl tracking-[0.15em] mb-4">Ayaka Nakagawa</h1>
        <p class="text-sm md:text-base text-gray-500 tracking-widest">Art Director / Illustrator</p>
    </header>

    <!-- メインコンテンツ（作品ギャラリー） -->
    <main class="flex-grow max-w-6xl mx-auto px-6 w-full pb-32">
        <!-- グリッドレイアウト（PC3列、スマホ1列、たっぷりの余白） -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 md:gap-16">
            
            <!-- 作品1 -->
            <div class="group cursor-pointer overflow-hidden fade-up">
                <!-- ↓ ここの src="..." を自分の画像に書き換えます -->
                <img src="https://images.unsplash.com/photo-1513364776144-60967e0f8fbf?w=800&q=80" alt="Work 1" class="w-full h-auto aspect-square object-cover transition-all duration-700 ease-in-out group-hover:scale-105 group-hover:opacity-80">
            </div>

            <!-- 作品2 -->
            <div class="group cursor-pointer overflow-hidden fade-up" style="transition-delay: 100ms;">
                <img src="https://images.unsplash.com/photo-1543857778-c4a1a3e0b2eb?w=800&q=80" alt="Work 2" class="w-full h-auto aspect-square object-cover transition-all duration-700 ease-in-out group-hover:scale-105 group-hover:opacity-80">
            </div>

            <!-- 作品3 -->
            <div class="group cursor-pointer overflow-hidden fade-up" style="transition-delay: 200ms;">
                <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=800&q=80" alt="Work 3" class="w-full h-auto aspect-square object-cover transition-all duration-700 ease-in-out group-hover:scale-105 group-hover:opacity-80">
            </div>

            <!-- 作品4 -->
            <div class="group cursor-pointer overflow-hidden fade-up" style="transition-delay: 0ms;">
                <img src="https://images.unsplash.com/photo-1579762715111-a6e19fd1e464?w=800&q=80" alt="Work 4" class="w-full h-auto aspect-square object-cover transition-all duration-700 ease-in-out group-hover:scale-105 group-hover:opacity-80">
            </div>

            <!-- 作品5 -->
            <div class="group cursor-pointer overflow-hidden fade-up" style="transition-delay: 100ms;">
                <img src="https://images.unsplash.com/photo-1579783483458-83d02161294e?w=800&q=80" alt="Work 5" class="w-full h-auto aspect-square object-cover transition-all duration-700 ease-in-out group-hover:scale-105 group-hover:opacity-80">
            </div>

            <!-- 作品6 -->
            <div class="group cursor-pointer overflow-hidden fade-up" style="transition-delay: 200ms;">
                <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&q=80" alt="Work 6" class="w-full h-auto aspect-square object-cover transition-all duration-700 ease-in-out group-hover:scale-105 group-hover:opacity-80">
            </div>

        </div>
    </main>

    <!-- フッター（Instagramリンク） -->
    <footer class="text-center py-24 fade-up">
        <p class="mb-8 text-gray-400 text-sm tracking-widest uppercase">Follow on Instagram</p>
        <a href="https://www.instagram.com/ayaka_poppy/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-3 text-gray-800 hover:text-gray-400 transition-colors duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span class="tracking-widest text-sm">@ayaka_poppy</span>
        </a>
    </footer>

    <!-- スクロールした時にふわっと表示させるためのプログラム（JavaScript） -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { root: null, rootMargin: '0px', threshold: 0.1 });

            document.querySelectorAll('.fade-up').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
