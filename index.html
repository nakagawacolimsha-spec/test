<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白峰蒸溜所 | SHIRAMINE DISTILLERY</title>
    <style>
        /* === 共通設定 === */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #111111;
            --easing-sharp: cubic-bezier(0.19, 1, 0.22, 1); 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-color: #000; /* 写真エリアの背景は黒にして没入感を高める */
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* プレースホルダー（後から写真や動画を入れる枠） */
        .placeholder {
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
        }

        /* === アニメーション設定 === */
        .reveal-mask {
            clip-path: polygon(0 0, 0 0, 0 100%, 0% 100%);
            transition: clip-path 1.2s var(--easing-sharp);
        }
        .reveal-mask.is-active {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s var(--easing-sharp), transform 1s var(--easing-sharp);
        }
        .reveal-up.is-active {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.3s; }
        .delay-3 { transition-delay: 0.5s; }

        /* === ヘッダー === */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2rem 4rem;
            box-sizing: border-box;
            z-index: 100;
            mix-blend-mode: difference;
            color: #fff;
        }
        .logo img {
            height: 35px;
            filter: brightness(0) invert(1);
        }

        /* === スクロールインジケーター === */
        .scroll-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: #fff;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            display: flex;
            flex-direction: column;
            align-items: center;
            mix-blend-mode: difference;
            opacity: 0.7;
        }
        .scroll-line {
            width: 1px;
            height: 40px;
            background-color: #fff;
            margin-top: 8px;
            /* スクロールを促す縦線のアニメーション */
            animation: scrollDown 2s infinite cubic-bezier(0.19, 1, 0.22, 1);
            transform-origin: top;
        }
        @keyframes scrollDown {
            0% { transform: scaleY(0); opacity: 0; }
            50% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0); opacity: 0; transform-origin: bottom; }
        }

        /* === 言葉なしで魅せるビジュアルセクション === */
        .visual-sequence {
            /* 連続するビジュアルの親要素 */
            display: flex;
            flex-direction: column;
        }

        .visual-slide {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .visual-slide-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* === 商品紹介セクション (PRODUCT) === */
        .product-section {
            background-color: #FAFAFA;
            padding: 20vh 10vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5vw;
            position: relative;
            z-index: 10;
        }
        
        .product-images {
            display: flex;
            gap: 2rem;
            width: 60%;
            align-items: flex-end;
        }
        
        .product-images .img-wrap {
            position: relative;
        }

        .product-images img {
            width: 100%;
            mix-blend-mode: multiply;
        }

        .product-text {
            width: 35%;
            color: #111;
        }

        .en-title {
            font-size: 4vw;
            font-weight: 700;
            letter-spacing: 0.15em;
            margin: 0 0 1rem 0;
        }
        
        .ja-subtitle {
            font-size: 1rem;
            letter-spacing: 0.1em;
            margin: 0 0 2rem 0;
            font-weight: normal;
        }

        .product-desc {
            font-size: 0.85rem;
            line-height: 2;
            letter-spacing: 0.05em;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="背景透過 ロゴと文字 左右 グレー.png" alt="白峰蒸溜所">
        </div>
    </header>

    <!-- 言葉がないため、ユーザーにスクロールを促すサイン -->
    <div class="scroll-indicator">
        SCROLL
        <div class="scroll-line"></div>
    </div>

    <main>
        <!-- 圧倒的なビジュアルだけで見せるシーケンス（4画面連続） -->
        <div class="visual-sequence">
            
            <!-- 1画面目：白峰の風景（動画やドローン映像などを想定） -->
            <section class="visual-slide">
                <div class="visual-slide-inner reveal-mask is-active"> <!-- 最初から表示 -->
                    <div class="placeholder">[1. 白峰の広大な風景・動画]</div>
                </div>
            </section>

            <!-- 2画面目：水や雪のシズル感 -->
            <section class="visual-slide">
                <div class="visual-slide-inner reveal-mask">
                    <div class="placeholder">[2. 雪解け水や澄んだ川のクローズアップ]</div>
                </div>
            </section>

            <!-- 3画面目：ボタニカル（植物）のディテール -->
            <section class="visual-slide">
                <div class="visual-slide-inner reveal-mask">
                    <div class="placeholder">[3. クロモジや森の植物の美しい写真]</div>
                </div>
            </section>

            <!-- 4画面目：歴史と人の営み -->
            <section class="visual-slide">
                <div class="visual-slide-inner reveal-mask">
                    <div class="placeholder">[4. 100年以上の古民家や蒸留器の重厚な写真]</div>
                </div>
            </section>
            
        </div>

        <!-- 視覚的カタルシスを経て、初めて商品とテキストが登場する -->
        <section class="product-section">
            <div class="product-images">
                <!-- ボトル写真 -->
                <div class="img-wrap reveal-mask delay-1" style="width: 55%;">
                    <img src="DSC_4311.jpg" alt="GOZEN CRAFT GIN ボトル">
                </div>
                <!-- グラス写真 -->
                <div class="img-wrap reveal-mask delay-2" style="width: 45%;">
                    <img src="DSC_4326.jpg" alt="ジントニック グラス">
                </div>
            </div>
            
            <div class="product-text reveal-up delay-3">
                <h2 class="en-title">GOZEN</h2>
                <h3 class="ja-subtitle">白峰を飲む、クラフトジン。</h3>
                <p class="product-desc">
                    SMALL BATCH CRAFT GIN<br><br>
                    造り手のこだわりではなく、<br>
                    飲み手の感動を基準に。<br><br>
                    ラベルに描かれた等高線は、<br>
                    白峰の自然とジオパークの力強さ。<br>
                    この土地の恵みを、一本のボトルに込めました。
                </p>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const revealElements = document.querySelectorAll('.reveal-mask:not(.is-active), .reveal-up');

            const observerOptions = {
                root: null,
                rootMargin: '0px 0px -15% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-active');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            revealElements.forEach(el => {
                observer.observe(el);
            });

            // 白背景の商品セクションに入ったら、SCROLLサインを非表示にする処理
            const productSection = document.querySelector('.product-section');
            const scrollIndicator = document.querySelector('.scroll-indicator');
            
            const productObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        scrollIndicator.style.opacity = '0';
                        scrollIndicator.style.transition = 'opacity 0.5s ease';
                    } else {
                        scrollIndicator.style.opacity = '0.7';
                    }
                });
            }, { rootMargin: '0px', threshold: 0.2 });
            
            productObserver.observe(productSection);
        });
    </script>
</body>
</html>
