<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白峰蒸溜所 | SHIRAMINE DISTILLERY</title>
    <style>
        /* === 共通設定 === */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #111111;
            --easing-sharp: cubic-bezier(0.19, 1, 0.22, 1); 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* プレースホルダー（後から写真を入れる枠） */
        /* ※写真が入ることを想定し、文字が目立つよう少し暗めのグレーにしています */
        .placeholder {
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 1rem;
            letter-spacing: 0.1em;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
        }

        /* === アニメーション設定 === */
        .reveal-mask {
            clip-path: polygon(0 0, 0 0, 0 100%, 0% 100%);
            transition: clip-path 1.2s var(--easing-sharp);
        }
        .reveal-mask.is-active {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s var(--easing-sharp), transform 1s var(--easing-sharp);
        }
        .reveal-up.is-active {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.3s; }
        .delay-3 { transition-delay: 0.5s; }

        /* === ヘッダー === */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2rem 4rem;
            box-sizing: border-box;
            z-index: 100;
            mix-blend-mode: difference;
            color: #fff;
        }
        .logo img {
            height: 35px;
            filter: brightness(0) invert(1);
        }

        /* === 写真で語るセクション (Story) === */
        .photo-slide {
            position: relative;
            width: 100vw;
            height: 100vh; /* 画面いっぱいの高さ */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .photo-slide-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .slide-copy {
            position: relative;
            z-index: 10;
            color: #fff;
            font-size: 2vw;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-align: center;
            mix-blend-mode: difference;
            margin: 0;
        }

        /* === 商品紹介セクション (PRODUCT) === */
        .product-section {
            background-color: #FAFAFA;
            padding: 20vh 10vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5vw;
        }
        
        .product-images {
            display: flex;
            gap: 2rem;
            width: 60%;
            align-items: flex-end; /* 画像の下端を揃える */
        }
        
        .product-images .img-wrap {
            position: relative;
        }

        .product-images img {
            width: 100%;
            mix-blend-mode: multiply; /* 白背景を透過させて馴染ませる */
        }

        .product-text {
            width: 35%;
        }

        .en-title {
            font-size: 4vw;
            font-weight: 700;
            letter-spacing: 0.15em;
            margin: 0 0 1rem 0;
        }
        
        .ja-subtitle {
            font-size: 1rem;
            letter-spacing: 0.1em;
            margin: 0 0 2rem 0;
            font-weight: normal;
        }

        .product-desc {
            font-size: 0.85rem;
            line-height: 2;
            letter-spacing: 0.05em;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="背景透過 ロゴと文字 左右 グレー.png" alt="白峰蒸溜所">
        </div>
    </header>

    <main>
        <!-- 写真で語るストーリーテリング -->
        
        <!-- 1枚目：ファーストビュー（風景） -->
        <section class="photo-slide">
            <div class="photo-slide-inner reveal-mask">
                <div class="placeholder">[白峰の雄大な風景写真を全面に]</div>
            </div>
            <h2 class="slide-copy reveal-up delay-2">白峰から、生まれる。</h2>
        </section>

        <!-- 2枚目：自然素材（雪・水・植物） -->
        <section class="photo-slide">
            <div class="photo-slide-inner reveal-mask">
                <div class="placeholder">[雪解け水や植物（クロモジなど）のクローズアップ写真]</div>
            </div>
            <h2 class="slide-copy reveal-up delay-2">雪、水、そして植物。</h2>
        </section>

        <!-- 3枚目：文化・歴史（古民家・JIGE） -->
        <section class="photo-slide">
            <div class="photo-slide-inner reveal-mask">
                <div class="placeholder">[100年以上の古民家や、蒸留器の重厚な写真]</div>
            </div>
            <h2 class="slide-copy reveal-up delay-2">100年の時を刻む場所。</h2>
        </section>

        <!-- 商品紹介への切り替え -->
        
        <!-- PRODUCT：GOZEN -->
        <section class="product-section">
            <div class="product-images">
                <!-- ボトル写真 -->
                <div class="img-wrap reveal-mask delay-1" style="width: 55%;">
                    <img src="DSC_4311.jpg" alt="GOZEN CRAFT GIN ボトル">
                </div>
                <!-- グラス写真（少し小さめに、高さをずらして配置） -->
                <div class="img-wrap reveal-mask delay-2" style="width: 45%;">
                    <img src="DSC_4326.jpg" alt="ジントニック グラス">
                </div>
            </div>
            
            <div class="product-text reveal-up delay-3">
                <h2 class="en-title">GOZEN</h2>
                <h3 class="ja-subtitle">白峰を飲む、クラフトジン。</h3>
                <p class="product-desc">
                    SMALL BATCH CRAFT GIN<br><br>
                    造り手のこだわりではなく、<br>
                    飲み手の感動を基準に。<br><br>
                    ラベルに描かれた等高線は、<br>
                    白峰の自然とジオパークの力強さ。<br>
                    この土地の恵みを、一本のボトルに込めました。
                </p>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const revealElements = document.querySelectorAll('.reveal-mask, .reveal-up');

            const observerOptions = {
                root: null,
                rootMargin: '0px 0px -15% 0px', // 画面の下から15%入ったところで発火
                threshold: 0
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-active');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            revealElements.forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
